<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Password Generator</title>
</head>

<body>
    <div id="container">
        <h1 id="heading">
            Generate a
            <span id="highlighted-heading">random password</span>
        </h1>
        <h2 id="sub-heading">
            Never use an insecure password again.
        </h2>
        <button id="generate-button" onclick="generate()">Generate Password</button>
        <div id="pass-generating-field">
            <div class="pass-field" id="pass-1"></div>
            <div class="pass-field" id="pass-2"></div>
        </div>
    </div>
    <script src="index.js"></script>
</body>

</html>
